<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08091d">
<title>بِصراحة 🎮</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 15%,#392477,transparent 35%),
    radial-gradient(circle at 0 80%,#28134f,transparent 35%),
    linear-gradient(150deg,#070817,#11102d 55%,#08091b);
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding:18px 17px 35px;
}

.hidden{
  display:none!important;
}

/* =========================
   شاشة البداية
========================= */

.welcome{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.welcome-box{
  width:100%;
  padding:28px 20px;
  border-radius:30px;
  background:rgba(17,18,43,.88);
  border:1px solid rgba(130,108,255,.35);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.welcome-crown{
  font-size:52px;
  animation:float 2.5s infinite;
}

.welcome-logo{
  margin-top:5px;
  font-size:58px;
  font-weight:1000;
  color:#ffc52c;
  letter-spacing:-5px;
  text-shadow:
    3px 3px #ed7911,
    6px 7px #111226;
}

.welcome-title{
  margin-top:18px;
  font-size:22px;
  font-weight:1000;
}

.welcome-desc{
  margin-top:9px;
  color:#a7a9c0;
  font-size:13px;
  line-height:1.7;
}

.name-input{
  width:100%;
  margin-top:25px;
  padding:17px;
  border-radius:17px;
  outline:none;
  border:2px solid #39365d;
  background:#0d0f27;
  color:white;
  text-align:center;
  font-size:17px;
}

.name-input:focus{
  border-color:#8871ff;
}

.choose-title{
  margin-top:22px;
  font-size:14px;
  color:#b9bad0;
  font-weight:bold;
}

.avatars{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:13px;
  flex-wrap:wrap;
}

.avatar-choice{
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  background:#202344;
  border:2px solid transparent;
  transition:.2s;
}

.avatar-choice.selected{
  border-color:#ffc52c;
  box-shadow:0 0 18px rgba(255,193,43,.35);
  transform:scale(1.08);
}

.start{
  width:100%;
  margin-top:25px;
  padding:17px;
  border-radius:19px;
  background:linear-gradient(#ffd442,#ff9c18);
  color:#171522;
  font-size:21px;
  font-weight:1000;
  box-shadow:0 6px #c96715;
}

.start:active{
  transform:translateY(5px);
  box-shadow:0 1px #c96715;
}

/* =========================
   الخلفية
========================= */

.orb{
  position:fixed;
  width:190px;
  height:190px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.18;
  pointer-events:none;
}

.orb.one{
  background:#8b45ff;
  top:10%;
  right:-100px;
}

.orb.two{
  background:#ffae22;
  bottom:15%;
  left:-100px;
}

/* =========================
   الرئيسية
========================= */

.header{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile{
  flex:1;
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 12px 8px 8px;
  border-radius:25px;
  background:rgba(19,19,48,.84);
  border:1px solid rgba(126,105,255,.28);
}

.avatar{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#24264d;
  border:3px solid #ffc52f;
  font-size:28px;
}

.player{
  flex:1;
}

.name{
  font-size:17px;
  font-weight:900;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.level-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.level{
  background:#ffbd24;
  color:#161525;
  border-radius:8px;
  padding:4px 8px;
  font-size:12px;
  font-weight:1000;
}

.progress{
  width:85px;
  height:7px;
  border-radius:20px;
  overflow:hidden;
  background:#383753;
}

.progress span{
  display:block;
  width:0%;
  height:100%;
  background:#ffcf3c;
}

.xp{
  color:#a6a7be;
  font-size:10px;
}

.settings{
  width:50px;
  height:50px;
  border-radius:18px;
  background:#171832;
  border:1px solid rgba(131,113,255,.3);
  color:white;
  font-size:24px;
}

/* الشعار */

.hero{
  text-align:center;
  margin-top:43px;
}

.crown{
  font-size:45px;
  animation:float 2.6s infinite;
}

.logo{
  font-size:62px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-5px;
  color:#ffc52c;
  text-shadow:
    3px 3px #ed7911,
    6px 7px #111226;
}

.tagline{
  width:max-content;
  max-width:100%;
  margin:20px auto 0;
  padding:13px 22px;
  border:2px solid rgba(255,192,39,.65);
  border-radius:18px;
  background:rgba(22,23,48,.8);
  font-size:16px;
  font-weight:900;
}

/* زر اللعب */

.play{
  width:100%;
  height:105px;
  margin-top:34px;
  border-radius:27px;
  background:linear-gradient(180deg,#ffd342,#ff9716);
  color:#111222;
  font-size:29px;
  font-weight:1000;
  box-shadow:
    0 8px #c96715,
    0 17px 35px rgba(255,165,24,.22);
}

.play:active{
  transform:translateY(7px);
  box-shadow:0 2px #c96715;
}

.play-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:45px;
  height:45px;
  margin-left:12px;
  border-radius:50%;
  background:#18182c;
  color:#ffc52d;
}

/* الكروت */

.cards{
  display:grid;
  gap:13px;
  margin-top:29px;
}

.card{
  width:100%;
  min-height:105px;
  display:flex;
  align-items:center;
  padding:15px 16px;
  border-radius:24px;
  background:linear-gradient(110deg,#171a3d,#10132e);
  border:1px solid rgba(104,91,225,.45);
  color:white;
  text-align:right;
  transition:.2s;
}

.card:active{
  transform:scale(.985);
}

.card-icon{
  width:59px;
  height:59px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:19px;
  margin-left:15px;
  background:#202344;
  font-size:29px;
}

.card-info{
  flex:1;
}

.card-title{
  font-size:20px;
  font-weight:1000;
}

.card-desc{
  color:#999bb9;
  font-size:12px;
  margin-top:7px;
  line-height:1.5;
}

.arrow{
  font-size:30px;
  color:#a99aff;
}

/* الفوتر */

.footer{
  margin-top:30px;
  text-align:center;
  color:#777a9b;
  font-size:12px;
}

.footer-line{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.line{
  width:70px;
  height:2px;
  background:#6757b8;
}

.footer-crown{
  color:#ffc32b;
  font-size:20px;
}

/* الرسالة */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  width:calc(100% - 40px);
  max-width:420px;
  padding:15px;
  border-radius:17px;
  background:#202342;
  border:1px solid rgba(255,190,37,.4);
  text-align:center;
  font-size:14px;
  font-weight:bold;
  transform:translate(-50%,130px);
  transition:.35s;
  z-index:50;
}

.toast.show{
  transform:translate(-50%,0);
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

@media(max-width:380px){

  .app{
    padding-left:13px;
    padding-right:13px;
  }

  .logo{
    font-size:53px;
  }

  .tagline{
    font-size:13px;
  }

  .play{
    height:90px;
    font-size:25px;
  }

  .card{
    min-height:95px;
  }

  .card-title{
    font-size:17px;
  }
}
</style>
</head>

<body>

<!-- شاشة إنشاء اللاعب -->

<section id="welcomeScreen" class="welcome">

  <div class="app">

    <div class="welcome-box">

      <div class="welcome-crown">👑</div>

      <div class="welcome-logo">
        بِصراحة
      </div>

      <div class="welcome-title">
        أهلًا بيك في بِصراحة 🎮
      </div>

      <div class="welcome-desc">
        قبل ما تبدأ، اختار اسمك وشخصيتك.
        <br>
        مفيش حسابات ولا تسجيل ولا فلوس.
      </div>

      <input
        id="nameInput"
        class="name-input"
        type="text"
        maxlength="18"
        placeholder="اكتب اسمك هنا..."
        autocomplete="off">

      <div class="choose-title">
        اختار شخصيتك
      </div>

      <div class="avatars">

        <button class="avatar-choice selected" onclick="chooseAvatar(this,'🧑🏻')">🧑🏻</button>
        <button class="avatar-choice" onclick="chooseAvatar(this,'👨🏻')">👨🏻</button>
        <button class="avatar-choice" onclick="chooseAvatar(this,'🧔🏻')">🧔🏻</button>
        <button class="avatar-choice" onclick="chooseAvatar(this,'👩🏻')">👩🏻</button>
        <button class="avatar-choice" onclick="chooseAvatar(this,'🧑🏽')">🧑🏽</button>
        <button class="avatar-choice" onclick="chooseAvatar(this,'👨🏽')">👨🏽</button>

      </div>

      <button class="start" onclick="createPlayer()">
        ابدأ اللعب 🎮
      </button>

    </div>

  </div>

</section>


<!-- الشاشة الرئيسية -->

<section id="homeScreen" class="hidden">

  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="app">

    <header class="header">

      <div class="profile">

        <div class="avatar" id="playerAvatar">
          🧑🏻
        </div>

        <div class="player">

          <div class="name" id="playerName">
            اللاعب
          </div>

          <div class="level-row">

            <span class="level">
              Lv. 1
            </span>

            <div class="progress">
              <span></span>
            </div>

            <span class="xp">
              0/100
            </span>

          </div>

        </div>

      </div>

      <button
        class="settings"
        onclick="showToast('⚙️ الإعدادات قريبًا')">
        ⚙️
      </button>

    </header>


    <section class="hero">

      <div class="crown">
        👑
      </div>

      <h1 class="logo">
        بِصراحة
      </h1>

      <div class="tagline">
        👀 قول الحقيقة... واكتشف الكدب!
      </div>

    </section>


    <button
      class="play"
      onclick="startGame()">

      <span class="play-icon">
        ▶
      </span>

      العب الآن

    </button>


    <section class="cards">

      <button
        class="card"
        onclick="showToast('👥 اللعب الجماعي قريبًا!')">

        <div class="card-icon">
          👥
        </div>

        <div class="card-info">

          <div class="card-title">
            اللعب الجماعي
          </div>

          <div class="card-desc">
            نافس أصحابك واكتشف مين بيكدب
          </div>

        </div>

        <div class="arrow">
          ‹
        </div>

      </button>


      <button
        class="card"
        onclick="showToast('🏆 أول مرحلة هتكون مليانة مفاجآت!')">

        <div class="card-icon">
          🏆
        </div>

        <div class="card-info">

          <div class="card-title">
            المراحل
          </div>

          <div class="card-desc">
            تحديات جديدة في انتظارك
          </div>

        </div>

        <div class="arrow">
          ‹
        </div>

      </button>


      <button
        class="card"
        onclick="showToast('📊 إحصائياتك هتظهر هنا!')">

        <div class="card-icon">
          📊
        </div>

        <div class="card-info">

          <div class="card-title">
            إحصائياتك
          </div>

          <div class="card-desc">
            شوف مستواك ونسبة فوزك وإنجازاتك
          </div>

        </div>

        <div class="arrow">
          ‹
        </div>

      </button>

    </section>


    <footer class="footer">

      <div class="footer-line">
        <span class="line"></span>
        <span class="footer-crown">♛</span>
        <span class="line"></span>
      </div>

      بِصراحة... كل شيء ممكن!

    </footer>

  </main>

</section>


<div id="toast" class="toast"></div>


<script>

let selectedAvatar = "🧑🏻";


/* اختيار الشخصية */

function chooseAvatar(button,avatar){

  document.querySelectorAll(".avatar-choice")
    .forEach(function(item){
      item.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedAvatar = avatar;
}


/* إنشاء اللاعب */

function createPlayer(){

  const input =
    document.getElementById("nameInput");

  let name =
    input.value.trim();

  if(name === ""){
    name = "اللاعب";
  }

  localStorage.setItem(
    "besarahaName",
    name
  );

  localStorage.setItem(
    "besarahaAvatar",
    selectedAvatar
  );

  loadPlayer();

}


/* تحميل اللاعب */

function loadPlayer(){

  const name =
    localStorage.getItem("besarahaName");

  const avatar =
    localStorage.getItem("besarahaAvatar");

  if(!name || !avatar){

    document
      .getElementById("welcomeScreen")
      .classList.remove("hidden");

    document
      .getElementById("homeScreen")
      .classList.add("hidden");

    return;
  }

  document
    .getElementById("welcomeScreen")
    .classList.add("hidden");

  document
    .getElementById("homeScreen")
    .classList.remove("hidden");

  document
    .getElementById("playerName")
    .textContent = name;

  document
    .getElementById("playerAvatar")
    .textContent = avatar;
}


/* زر اللعب */

function startGame(){

  showToast(
    "🎮 أول تحدي هيبدأ قريب!"
  );

}


/* الرسائل */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(function(){

    toast.classList.remove("show");

  },2200);
}


/* تشغيل اللعبة */

loadPlayer();

</script>

</body>
  </html>
