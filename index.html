<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08091d">
<title>بِصراحة 🎮</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 18%,#34216d 0%,transparent 34%),
    radial-gradient(circle at 0% 75%,#281451 0%,transparent 32%),
    radial-gradient(circle at 100% 100%,#24114b 0%,transparent 35%),
    linear-gradient(150deg,#070817,#11102d 55%,#08091b);
  overflow-x:hidden;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(142,77,255,.12),transparent 20%),
    radial-gradient(circle at 85% 80%,rgba(255,167,26,.08),transparent 22%);
}

/* التطبيق */
.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding:18px 17px 35px;
}

/* نقاط الإضاءة */
.orb{
  position:fixed;
  width:180px;
  height:180px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.18;
  pointer-events:none;
}

.orb.one{
  background:#8b45ff;
  top:10%;
  right:-100px;
}

.orb.two{
  background:#ffae22;
  bottom:15%;
  left:-100px;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

/* البروفايل */
.profile{
  flex:1;
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 12px 8px 8px;
  border-radius:25px;
  background:rgba(19,19,48,.84);
  border:1px solid rgba(126,105,255,.28);
  box-shadow:
    inset 0 1px rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.18);
}

.avatar{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 35% 30%,#ffd95a,#ff9b20 55%,#d95615);
  border:3px solid #ffc52f;
  font-size:28px;
  box-shadow:0 0 20px rgba(255,188,37,.2);
}

.player{
  flex:1;
}

.name{
  font-size:17px;
  font-weight:900;
  margin-bottom:6px;
}

.level-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.level{
  background:#ffbd24;
  color:#161525;
  border-radius:8px;
  padding:4px 8px;
  font-size:12px;
  font-weight:1000;
}

.progress{
  width:85px;
  height:7px;
  border-radius:20px;
  overflow:hidden;
  background:#383753;
}

.progress span{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ffbd24,#ffe26a);
  border-radius:20px;
}

.xp{
  color:#a6a7be;
  font-size:10px;
}

/* الإعدادات */
.settings{
  width:50px;
  height:50px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171832;
  border:1px solid rgba(131,113,255,.3);
  color:#fff;
  font-size:25px;
  transition:.2s;
}

.settings:active{
  transform:rotate(25deg) scale(.94);
}

/* ================= LOGO ================= */

.hero{
  text-align:center;
  margin-top:43px;
}

.crown{
  display:block;
  font-size:45px;
  margin-bottom:2px;
  filter:
    drop-shadow(0 5px 7px rgba(255,185,25,.4))
    drop-shadow(0 0 15px rgba(255,185,25,.18));
  animation:float 2.6s ease-in-out infinite;
}

.logo{
  display:inline-block;
  position:relative;
  font-size:62px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-5px;
  color:#ffc52c;
  text-shadow:
    3px 3px 0 #ed7911,
    6px 7px 0 #111226,
    0 14px 25px rgba(255,175,25,.2);
}

.logo::before{
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  background:#ffcf3c;
  border-radius:50%;
  top:-3px;
  right:8px;
  box-shadow:0 0 12px #ffbd24;
}

.tagline{
  width:max-content;
  max-width:100%;
  margin:20px auto 0;
  padding:13px 22px;
  border:2px solid rgba(255,192,39,.65);
  border-radius:18px;
  background:rgba(22,23,48,.8);
  box-shadow:
    0 8px 25px rgba(0,0,0,.2),
    inset 0 0 20px rgba(255,192,39,.03);
  font-size:16px;
  font-weight:900;
}

/* ================= PLAY ================= */

.play{
  position:relative;
  width:100%;
  height:105px;
  margin-top:34px;
  border-radius:27px;
  background:linear-gradient(
    180deg,
    #ffd342 0%,
    #ffb21e 58%,
    #ff9716 100%
  );
  color:#111222;
  font-size:29px;
  font-weight:1000;
  box-shadow:
    0 8px 0 #c96715,
    0 17px 35px rgba(255,165,24,.22);
  overflow:hidden;
  transition:.15s;
}

.play::before{
  content:"";
  position:absolute;
  top:-20px;
  right:-90px;
  width:65px;
  height:150px;
  background:rgba(255,255,255,.22);
  transform:rotate(20deg);
  animation:shine 3.5s infinite;
}

.play:active{
  transform:translateY(7px);
  box-shadow:
    0 2px 0 #c96715,
    0 10px 20px rgba(255,165,24,.16);
}

.play-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:45px;
  height:45px;
  margin-left:12px;
  border-radius:50%;
  background:#18182c;
  color:#ffc52d;
  font-size:21px;
  vertical-align:middle;
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  gap:13px;
  margin-top:29px;
}

.card{
  width:100%;
  min-height:105px;
  display:flex;
  align-items:center;
  padding:15px 16px;
  border-radius:24px;
  background:
    linear-gradient(110deg,#171a3d,#10132e);
  border:1px solid rgba(104,91,225,.45);
  box-shadow:
    0 9px 25px rgba(0,0,0,.18),
    inset 0 1px rgba(255,255,255,.035);
  color:#fff;
  text-align:right;
  transition:.2s;
}

.card:active{
  transform:scale(.985);
  border-color:#856eff;
}

.card-icon{
  width:59px;
  height:59px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:19px;
  margin-left:15px;
  background:
    radial-gradient(circle at 35% 25%,#303465,#191b43);
  border:1px solid rgba(130,113,255,.2);
  font-size:29px;
  box-shadow:0 7px 18px rgba(0,0,0,.2);
}

.card-info{
  flex:1;
}

.card-title{
  font-size:20px;
  font-weight:1000;
}

.card-desc{
  color:#999bb9;
  font-size:12px;
  margin-top:7px;
  line-height:1.5;
}

.arrow{
  font-size:30px;
  color:#a99aff;
  font-weight:300;
}

/* ================= FOOTER ================= */

.footer{
  margin-top:30px;
  text-align:center;
  color:#777a9b;
  font-size:12px;
}

.footer-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:10px;
}

.line{
  width:70px;
  height:2px;
  background:linear-gradient(90deg,transparent,#6757b8);
}

.footer-crown{
  color:#ffc32b;
  font-size:20px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  width:calc(100% - 40px);
  max-width:420px;
  padding:15px 18px;
  border-radius:17px;
  background:#202342;
  border:1px solid rgba(255,190,37,.4);
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  text-align:center;
  font-size:14px;
  font-weight:bold;
  transform:translate(-50%,130px);
  transition:.35s;
  z-index:50;
}

.toast.show{
  transform:translate(-50%,0);
}

/* ================= ANIMATION ================= */

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(0);
  }
  50%{
    transform:translateY(-7px) rotate(-2deg);
  }
}

@keyframes shine{
  0%{
    right:-100px;
  }
  35%,100%{
    right:120%;
  }
}

/* الشاشات الصغيرة */
@media(max-width:380px){

  .app{
    padding-left:13px;
    padding-right:13px;
  }

  .avatar{
    width:46px;
    height:46px;
    font-size:24px;
  }

  .settings{
    width:46px;
    height:46px;
  }

  .logo{
    font-size:53px;
  }

  .tagline{
    font-size:13px;
    padding:11px 15px;
  }

  .play{
    height:90px;
    font-size:25px;
  }

  .card{
    min-height:95px;
  }

  .card-title{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="app">

  <!-- البروفايل -->
  <header class="header">

    <div class="profile">

      <div class="avatar">😎</div>

      <div class="player">

        <div class="name">محمد</div>

        <div class="level-row">

          <span class="level">Lv. 1</span>

          <div class="progress">
            <span></span>
          </div>

          <span class="xp">0/100</span>

        </div>

      </div>

    </div>

    <button class="settings" onclick="showToast('⚙️ الإعدادات قريبًا')">
      ⚙️
    </button>

  </header>


  <!-- الشعار -->
  <section class="hero">

    <div class="crown">👑</div>

    <h1 class="logo">بِصراحة</h1>

    <div class="tagline">
      👀 قول الحقيقة... واكتشف الكدب!
    </div>

  </section>


  <!-- زر البداية -->
  <button class="play" onclick="startGame()">
    <span class="play-icon">▶</span>
    العب الآن
  </button>


  <!-- القائمة -->
  <section class="cards">

    <button class="card" onclick="showToast('👥 اللعب الجماعي قريبًا!')">

      <div class="card-icon">👥</div>

      <div class="card-info">
        <div class="card-title">اللعب الجماعي</div>
        <div class="card-desc">
          نافس أصحابك واكتشف مين بيكدب
        </div>
      </div>

      <div class="arrow">‹</div>

    </button>


    <button class="card" onclick="showToast('🏆 أول مرحلة هتكون مليانة مفاجآت!')">

      <div class="card-icon">🏆</div>

      <div class="card-info">
        <div class="card-title">المراحل</div>
        <div class="card-desc">
          تحديات جديدة في انتظارك
        </div>
      </div>

      <div class="arrow">‹</div>

    </button>


    <button class="card" onclick="showToast('📊 إحصائياتك هتظهر هنا!')">

      <div class="card-icon">📊</div>

      <div class="card-info">
        <div class="card-title">إحصائياتك</div>
        <div class="card-desc">
          شوف مستواك ونسبة فوزك وإنجازاتك
        </div>
      </div>

      <div class="arrow">‹</div>

    </button>


  </section>


  <!-- الفوتر -->
  <footer class="footer">

    <div class="footer-line">
      <span class="line"></span>
      <span class="footer-crown">♛</span>
      <span class="line"></span>
    </div>

    بِصراحة... كل شيء ممكن!

  </footer>

</main>


<!-- رسالة صغيرة -->
<div class="toast" id="toast"></div>


<script>

function showToast(text){

  const toast = document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(function(){
    toast.classList.remove("show");
  },2200);

}


function startGame(){

  showToast("🎮 جاري تجهيز أول تحدي...");

}

</script>

</body>
</html>
